##################################################
# Configuration file for the guidance, navigation
# and control modules running on the abv.
#################################################

Guidance:
  StateMachine:
    Rate: 10 # Hz
    WaypointTimeout: 30 # seconds - default max time to wait for arrival at a single waypoint
    WaypointTimeoutToleranceScale: 2.0 # multiplier on arrival tolerance checked when a waypoint timeout fires

Navigation:
  Interface: simulated # simulated or optitrak
  Rate: 25 # Hz
  RigidBodyName: ABV1
  MaxDeadReckonDuration: 0.5 # seconds - EKF free-run bound before output is frozen and marked invalid
  SimulateDropout: false # abv_simulator only - enables synthetic burst nav dropouts for testing
  VelocityAlertThreshold: 0.125 # m/s, SYS.01 (0.10 + 25% margin)
  VelocityAlertClear: 0.115 # m/s, alert clears below this (hysteresis)

  Network:
    Local:
      Ip: 192.168.1.15

    Server:
      Ip: 127.0.0.1

Docking:
  TargetPose: [3.4, 0.9, 3.14159] # SIM PLACEHOLDER: passive face center x, y (m), outward normal yaw (rad). Replace with surveyed values.
  PortOffset: 0.30 # TBD: measure, ABV rigid-body origin to active face (m)
  StandoffDistance: 0.50 # m, face gap at start of approach
  ApproachVelocity: 0.075 # m/s, SYS.10 band 0.05-0.10
  ApproachTimeout: 30.0 # s
  CaptureRange: 0.01 # m, stop if gap below this and no lock
  StartTolerance: [0.015, 0.015, 0.017] # m, m, rad (TEST.10/11)
  DwellTime: 5.0 # s docked before UNLOCK
  Cycles: 2 # SYS.02 target is 20; 2 keeps sim tests short. Real tests: ~3 per nitrogen tank
  SerialPort: /dev/ttyACM0
  BaudRate: 115200
  StatusTimeout: 0.5 # s
  SimulateContact: true # abv_simulator only: solid target face + fake lock. No effect on the real vehicle
  TargetHalfWidth: 0.15 # m, half width of the passive face (sim contact check)

Control:
  StateMachine:
    Rate: 10 # hz

  Arrival:
    Tolerance: [0.05, 0.05, 0.05] # [m, m, rad]
    Duration: 3 # seconds

  NavDataTimeout: 1.0 # seconds - max time since last abv/state message before nav is considered stale

  Dynamics:
    Mass: 12.7 # kg
    Inertia: 0.3 # kg-m^2
    ThrusterForce: 0.1 # N
    MomentArm: 0.1235 # m
    PropagationMode: internal # "internal" (self-integrate) | "external" (Gazebo-sourced, via abv/sim/gazebo_state)
    ExternalStateTopic: abv/sim/gazebo_state # abv_msgs/AbvState, published by abv_bridge's GazeboStateConvertor
    WrenchCommandTopic: mujoco/wrench_cmd # geometry_msgs/WrenchStamped, consumed by ptera_sim's WrenchApplicator
    WrenchTargetLink: base_link # stamped as the wrench's frame_id

# Consumed by abv_control (and, in future, any other IControlLaw-hosting node).
ControlLaw:
  Law: PID # which IControlLaw abv_control instantiates: PID today, room for LQR | MPC later

  Pid: # pose goals
    Kp: [25.0, 25.0, 5.0]
    Ki: [0, 0, 0]
    Kd: [155.0, 155.0, 15.0]

  VelocityPid: # velocity goals (docking approach, braking). Kd must stay ~0: it acts on acceleration here
    Kp: [50.0, 50.0, 10.0]
    Ki: [0, 0, 0]
    Kd: [0, 0, 0]

# Consumed by abv_thrusters.
Thrusters:
  InputDiscretization:
    On: [0.2, 0.2, 0.2]
    Off: [0.09, 0.09, 0.09]

  AllocationStrategy: LookupTable # LookupTable | Matrix

  Allocation:
    x: [0, 0, -1, -1, 0, 0, 1, 1]
    y: [1, 1, 0, 0, -1, -1, 0, 0]
    yaw: [-1, 1, -1, 1, -1, 1, -1, 1]

    # firing cutoff on the pseudo-inverse solution; Matrix strategy only.
    # Must stay below 0.125 (yaw-only commands solve to +-0.125 per thruster
    # since all 8 thrusters carry a yaw term, vs +-0.25 for pure x/y) or
    # pure-yaw commands silently produce zero thrust. Verified in sim;
    # still needs a real hardware bench tuning pass before trusting it.
    Threshold: 0.1

  ThrusterDriver:
    Type: JETGPIO
    GPIO:
      pins: [12, 7, 8, 24, 19, 22, 15, 13]

  # mirrors Control.Dynamics.ThrusterForce/MomentArm above - duplicated here
  # so abv_thrusters doesn't need to read the Control section.
  Force: 0.1 # N
  MomentArm: 0.1235 # m

Heartbeat:
  Rate: 2 # Hz - per-node heartbeat publish rate
  StaleAfter: 2.0 # seconds - GUI marks a node disconnected if no heartbeat arrives within this window
  PingIntervalMs: 1000 # GUI-side: how often to ping the robot host for the Comms indicator

TableView:
  Width: 3.6 # meters - table X extent, GUI-side top-down view
  Height: 1.8 # meters - table Y extent
  RobotWidth: 0.35 # meters - footprint used to draw the robot glyph, tune to the real chassis
  RobotLength: 0.35

Scene:
  XMin: 0.0 # meters - region the ABV must remain within (world frame, same convention as AbvVec3/AbvState)
  XMax: 3.6 # matches TableView.Width
  YMin: 0.0
  YMax: 1.8 # matches TableView.Height

CollisionAvoid:
  GridResolution: 0.1 # meters/cell - CollisionAvoidPathGenerator's A* search grid
  ReplanRate: 5 # Hz - background A* re-solve rate
